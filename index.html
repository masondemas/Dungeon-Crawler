<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Crawler</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, serif;
      color: #e8dcc0;
    }

    /* The little "+" in the middle of the screen */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
    }
    #crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
    #crosshair::after  { top: 7px; left: 0; width: 16px; height: 2px; }

    /* Small controls reminder in the corner */
    #hint {
      position: fixed;
      right: 16px;
      top: 16px;
      text-align: right;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(232, 220, 192, 0.3);
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.6;
      pointer-events: none;
    }

    /* Full-screen "click to play" overlay, shown when the mouse is not locked */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      cursor: pointer;
      text-align: center;
    }
    /* Level name in the top-left corner */
    #level-name {
      position: fixed;
      top: 16px;
      left: 16px;
      font-size: 18px;
      letter-spacing: 1px;
      text-shadow: 0 0 6px #000;
      pointer-events: none;
    }

    /* ---- Health and stamina bars (bottom centre) ---- */
    #bars {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      pointer-events: none;
    }
    .bar {
      position: relative;
      width: 220px;
      height: 14px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(232, 220, 192, 0.45);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar .ghost,
    .bar .fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;              /* bars shrink in from both ends, like Skyrim */
      width: 100%;
      transform: translateX(-50%);
    }
    .bar .ghost { background: rgba(255, 240, 200, 0.45); }
    .bar .label {
      position: absolute;
      inset: 0;
      font-size: 10px;
      line-height: 14px;
      text-align: center;
      text-shadow: 0 0 3px #000;
    }
    #health-bar .fill  { background: linear-gradient(#d4473b, #8e1f17); }
    #stamina-bar .fill { background: linear-gradient(#5fbf55, #2c7a26); }
    #stamina-bar.winded .fill { background: linear-gradient(#8a8f55, #50542c); }

    /* Red flash around the screen edges when hurt */
    #hurt-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 160px 40px rgba(200, 0, 0, 0.8);
      opacity: 0;
    }

    #overlay h1 { margin: 0 0 12px; font-size: 42px; letter-spacing: 2px; }
    #overlay p  { margin: 4px; font-size: 18px; }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="level-name"></div>

  <div id="hint">
    <b>W A S D</b> move &nbsp;·&nbsp; <b>Mouse</b> look &nbsp;·&nbsp; <b>Shift</b> run<br>
    <b>Esc</b> release mouse<br>
    <span style="opacity:0.6"><b>K</b> hurt yourself (test only)</span>
  </div>

  <div id="hurt-flash"></div>

  <div id="bars">
    <div class="bar" id="health-bar"><div class="ghost"></div><div class="fill"></div><div class="label"></div></div>
    <div class="bar" id="stamina-bar"><div class="ghost"></div><div class="fill"></div><div class="label"></div></div>
  </div>

  <div id="overlay">
    <h1>DUNGEON</h1>
    <p>Click to play</p>
    <p style="opacity:0.7">W A S D to move · Mouse to look · Shift to run · Esc to pause</p>
  </div>

  <!-- Tells the browser where to download Three.js from (no install needed) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
